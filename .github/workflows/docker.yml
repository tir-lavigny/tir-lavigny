name: Build and publish Docker images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build (e.g. v1.2.3 or v1.2.3-dev.5)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/tir-lavigny/laravel-app
  IMAGE_WEB: ghcr.io/tir-lavigny/laravel-web

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.env.outputs.version }}
      is_dev: ${{ steps.env.outputs.is_dev }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Determine environment
        id: env
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-dev"* ]]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push Laravel app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.env.outputs.version }}
            ${{ env.IMAGE_APP }}:${{ steps.env.outputs.sha_tag }}
          cache-from: type=gha,scope=laravel-app
          cache-to: type=gha,mode=max,scope=laravel-app

      - name: Build and push Laravel web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.env.outputs.version }}
            ${{ env.IMAGE_WEB }}:${{ steps.env.outputs.sha_tag }}
          cache-from: type=gha,scope=laravel-web
          cache-to: type=gha,mode=max,scope=laravel-web

  deploy-staging:
    needs: docker
    if: needs.docker.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: laravel-staging-deploy
      cancel-in-progress: false

    steps:
      - name: Load SSH private key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (staging)
        run: |
          ssh ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} \
            "sudo /usr/local/sbin/tir-lavigny-deploy-staging ${{ needs.docker.outputs.version }}"
