name: Build and publish Docker images

on:
  push:
    tags:
      - 'v*'
      - '!*-rev.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build (e.g. v1.2.3 or v1.2.3-dev.5)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/tir-lavigny/laravel-app
  IMAGE_WEB: ghcr.io/tir-lavigny/laravel-web

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.env.outputs.version }}
      is_dev: ${{ steps.env.outputs.is_dev }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Determine environment
        id: env
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-dev"* ]]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push Laravel app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          build-args: |
            VITE_APP_NAME=${{ steps.env.outputs.is_dev == 'true' && 'Staging - Tir Lavigny' || 'Tir Lavigny' }}
            VITE_BUILD_TAG=${{ steps.env.outputs.version }}

          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.env.outputs.version }}
            ${{ env.IMAGE_APP }}:${{ steps.env.outputs.sha_tag }}
          cache-from: type=gha,scope=laravel-app
          cache-to: type=gha,mode=max,scope=laravel-app

      - name: Build and push Laravel web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          build-args: |
            VITE_APP_NAME=${{ steps.env.outputs.is_dev == 'true' && 'Staging - Tir Lavigny' || 'Tir Lavigny' }}
            VITE_BUILD_TAG=${{ steps.env.outputs.version }}

          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.env.outputs.version }}
            ${{ env.IMAGE_WEB }}:${{ steps.env.outputs.sha_tag }}
          cache-from: type=gha,scope=laravel-web
          cache-to: type=gha,mode=max,scope=laravel-web

      - name: Scan images
        env:
          VERSION: ${{ steps.env.outputs.version }}
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.1"
          TRIVY_SHA256="3350f4fac96ed099590c4a353bddb226f86311a0a2e7a8c626c162790d947f10"
          curl -sSLo /tmp/trivy.deb "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          echo "${TRIVY_SHA256}  /tmp/trivy.deb" | sha256sum -c -
          sudo apt-get install -y /tmp/trivy.deb >/dev/null

          APP="ghcr.io/tir-lavigny/laravel-app:${VERSION}"
          WEB="ghcr.io/tir-lavigny/laravel-web:${VERSION}"

          {
            echo "## Trivy scan: ${VERSION}"
            for img in "$APP" "$WEB"; do
              echo "### ${img}"
              trivy image --severity HIGH,CRITICAL --ignore-unfixed --quiet --format table "$img" || true
            done
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for img in "$APP" "$WEB"; do
            n="$(trivy image --severity CRITICAL --ignore-unfixed --quiet --format json "$img" \
                | jq '[.Results[]?.Vulnerabilities[]?] | length')"
            if (( n > 0 )); then
              echo "::error::${img}: ${n} fixable CRITICAL — deploy blocked"
              fail=1
            fi
          done
          exit "$fail"

  deploy-staging:
    needs: docker
    if: needs.docker.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.tir-lavigny.ch/
    concurrency:
      group: laravel-staging-deploy
      cancel-in-progress: false

    steps:
      - name: Load SSH private key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (staging)
        run: |
          ssh ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} \
            "sudo /usr/local/sbin/tir-lavigny-deploy-staging ${{ needs.docker.outputs.version }}"

  dev-release:
    needs: docker
    if: needs.docker.outputs.is_dev == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create dev release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ needs.docker.outputs.version }}" >/dev/null 2>&1 || \
          gh release create "${{ needs.docker.outputs.version }}" \
            --title "${{ needs.docker.outputs.version }}" \
            --prerelease \
            --generate-notes
