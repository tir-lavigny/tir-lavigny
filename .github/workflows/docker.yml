name: Build and publish Docker images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build (e.g. v1.2.3 or v1.2.3-dev.5)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/tir-lavigny/laravel-app
  IMAGE_WEB: ghcr.io/tir-lavigny/laravel-web

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.env.outputs.version }}
      is_dev: ${{ steps.env.outputs.is_dev }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Determine environment
        id: env
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-dev"* ]]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push Laravel app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          build-args: |
            VITE_APP_NAME=${{ steps.env.outputs.is_dev == 'true' && 'Staging - Tir Lavigny' || 'Tir Lavigny' }}

          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.env.outputs.version }}
            ${{ env.IMAGE_APP }}:${{ steps.env.outputs.sha_tag }}
          cache-from: type=gha,scope=laravel-app
          cache-to: type=gha,mode=max,scope=laravel-app

      - name: Build and push Laravel web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          build-args: |
            VITE_APP_NAME=${{ steps.env.outputs.is_dev == 'true' && 'Staging - Tir Lavigny' || 'Tir Lavigny' }}

          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.env.outputs.version }}
            ${{ env.IMAGE_WEB }}:${{ steps.env.outputs.sha_tag }}
          cache-from: type=gha,scope=laravel-web
          cache-to: type=gha,mode=max,scope=laravel-web

  deploy-staging:
    needs: docker
    if: needs.docker.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.tir-lavigny.ch/
    concurrency:
      group: laravel-staging-deploy
      cancel-in-progress: false

    steps:
      - name: Load SSH private key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (staging)
        run: |
          ssh ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} \
            "sudo /usr/local/sbin/tir-lavigny-deploy-staging ${{ needs.docker.outputs.version }}"

  dev-release:
    needs: docker
    if: needs.docker.outputs.is_dev == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create dev release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ needs.docker.outputs.version }}" >/dev/null 2>&1 || \
          gh release create "${{ needs.docker.outputs.version }}" \
            --title "${{ needs.docker.outputs.version }}" \
            --prerelease \
            --generate-notes
