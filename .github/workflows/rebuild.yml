name: Weekly rebuild

# Rebuilds images from current main with a fresh base OS layer (apk upgrade),
# scans them (the scan gate runs inside docker.yml), deploys staging
# automatically, and upserts the persistent review issue for the manual
# production pull. Production never deploys from here (Option A).

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: laravel-rebuild
  cancel-in-progress: false

jobs:
  rebuild-tags:
    runs-on: ubuntu-latest
    outputs:
      prod: ${{ steps.compute.outputs.prod }}
      staging: ${{ steps.compute.outputs.staging }}
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Compute and create rev tags
        id: compute
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d)

          LATEST=$(git tag -l 'v*' | grep -vE '\-(dev|rev)' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then echo "::error::no release tag found"; exit 1; fi
          PROD="${LATEST}-rev.${DATE}"

          LATEST_DEV=$(git tag -l 'v*' | grep -v rev | grep -E '\-dev\.' | sort -V | tail -1 || true)
          STAGING=""
          if [ -n "$LATEST_DEV" ]; then
            STAGING="${LATEST_DEV}-rev.${DATE}"
          else
            echo "::warning::no dev tag found — staging rebuild skipped"
          fi

          echo "prod=${PROD}" >> "$GITHUB_OUTPUT"
          echo "staging=${STAGING}" >> "$GITHUB_OUTPUT"

          git config user.name "tir-lavigny-cd[bot]"
          git config user.email "${{ steps.app-token.outputs.installation-id }}+tir-lavigny-cd[bot]@users.noreply.github.com"
          # Each rev tag pins its own environment's lineage: prod tag -> release
          # commit, staging tag -> latest dev commit. The rebuild must refresh
          # only the base layer, never move code.
          tag_commit() {
            local tag="$1" commit="$2"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "tag exists: $tag"
            else
              git tag -a "$tag" "$commit" -m "Weekly rebuild"
              git push origin "$tag"
              echo "created: $tag -> $(git rev-parse --short "$commit")"
            fi
          }
          tag_commit "$PROD" "$LATEST"
          if [ -n "$STAGING" ]; then
            tag_commit "$STAGING" "$LATEST_DEV"
          fi

  build-staging:
    needs: rebuild-tags
    if: ${{ needs.rebuild-tags.outputs.staging != '' }}
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.rebuild-tags.outputs.staging }}
    secrets: inherit

  build-production:
    needs: rebuild-tags
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.rebuild-tags.outputs.prod }}
    secrets: inherit

  review-issue:
    needs: [rebuild-tags, build-staging, build-production]
    if: >-
      always() &&
      needs.rebuild-tags.result == 'success' &&
      needs.build-production.result == 'success' &&
      needs.build-staging.result != 'failure' &&
      needs.build-staging.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Upsert review issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PROD: ${{ needs.rebuild-tags.outputs.prod }}
          STAGING: ${{ needs.rebuild-tags.outputs.staging }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-production.yml
          TITLE: '[rev] Production image ready for review'
        run: |
          set -euo pipefail
          if [ -n "$STAGING" ]; then
            STAGING_LINE="- **Staging tag**: \`${STAGING}\` — deployed automatically; verify at https://staging.tir-lavigny.ch"
          else
            STAGING_LINE="- **Staging**: skipped this cycle (no dev tag)"
          fi
          BODY="$(cat <<EOF
          Weekly rebuild ready for production review.

          - **Production tag**: \`${PROD}\` (images built + scan-gated, NOT deployed)
          ${STAGING_LINE}
          - **Scan**: gate passed (no fixable CRITICAL) — full report in the [build run](${RUN_URL}) step summary

          Checklist:
          - [ ] Review scan summary + staging
          - [ ] Deploy: run [Deploy to production](${DEPLOY_URL}) with version \`${PROD}\`
          - [ ] Verify https://tir-lavigny.ch + /up
          - [ ] Close this issue

          Body refreshes on every rebuild while open; closing after deployment re-notifies on the next cycle.
          EOF
          )"
          existing="$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$BODY" --add-assignee zurfjereluhmie
            echo "issue updated #${existing}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee zurfjereluhmie
            echo "issue created"
          fi