name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  lint:
    uses: ./.github/workflows/lint.yml

  build-image:
    if: github.event_name == 'pull_request'
    needs:
      - tests
      - lint
    uses: ./.github/workflows/build-image.yml
