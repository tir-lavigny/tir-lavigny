name: Run Observability Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC

jobs:
  observability:
    name: Start observability agent
    runs-on: ubuntu-latest
    steps:
      - name: Run observability script on server
        uses: appleboy/ssh-action@master
        with:
          username: ${{ secrets.MASTER_SSH_USERNAME }}
          host: ${{ secrets.MASTER_SSH_HOST }}
          key: ${{ secrets.MASTER_SSH_KEY }}
          port: ${{ secrets.MASTER_SSH_PORT }}
          script: |
            cd ${{ secrets.MASTER_SSH_PATH }}
            chmod +x ./observability.sh
            ./observability.sh
