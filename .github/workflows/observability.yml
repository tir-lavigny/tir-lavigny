name: Run Observability Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC

jobs:
  observability:
    name: Start observability agent
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and Restart Nightwatch Daemon
        env:
          OBSERVABILITY_DEPLOY_TOKEN: ${{ secrets.OBSERVABILITY_DEPLOY_TOKEN }}
        run: |
          curl -X POST https://tir-lavigny.ch/observability/run \
          -H "X-Obs-Token: $OBSERVABILITY_DEPLOY_TOKEN" \
          -H "Accept: application/json"
