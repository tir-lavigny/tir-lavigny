name: Docker prod build check

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build prod image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build prod image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: prod
          push: false
          # Cache layers between runs to keep build times fast
          cache-from: type=gha
          cache-to: type=gha,mode=max
