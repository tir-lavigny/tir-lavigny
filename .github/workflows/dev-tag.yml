name: Dev Tag

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-tag
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check for image-relevant changes
        id: relevant
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: always build"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=$(git describe --tags --match 'v*-dev.*' --abbrev=0 HEAD 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            echo "No previous dev tag: build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif files=$(.github/scripts/image-relevant-changes.sh "$BASE" HEAD); then
            printf '%s\n' "$files"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image-relevant changes since $BASE: skip"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate version
        if: steps.relevant.outputs.build == 'true'
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' | grep -v '\-dev' | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git rev-list HEAD --count)
            echo "tag=v0.0.0-dev.${COMMITS}" >> "$GITHUB_OUTPUT"
          else
            COMMITS=$(git rev-list "${LATEST_TAG}..HEAD" --count)
            BASE=${LATEST_TAG#v}
            echo "tag=v${BASE}-dev.${COMMITS}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.relevant.outputs.build == 'true'
        run: |
          git config user.name  "tir-lavigny-cd[bot]"
          git config user.email "${{ steps.app-token.outputs.installation-id }}+tir-lavigny-cd[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Dev build"
          git push origin "${{ steps.version.outputs.tag }}"
