name: Dev Tag

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-tag
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' | grep -v '\-dev' | sort -V | tail -1)
          [ -z "$LATEST_TAG" ] && LATEST_TAG="v0.0.0"
          COMMITS=$(git rev-list ${LATEST_TAG}..HEAD --count)
          BASE=${LATEST_TAG#v}
          echo "tag=v${BASE}-dev.${COMMITS}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name  "tir-lavigny-cd[bot]"
          git config user.email "${{ steps.app-token.outputs.installation-id }}+tir-lavigny-cd[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Dev build"
          git push origin "${{ steps.version.outputs.tag }}"
