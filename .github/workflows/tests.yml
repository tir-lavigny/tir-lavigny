name: tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: pcov

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Create SQLite Database for Pulse
        run: touch database/pulse.sqlite

      - name: Create SQLite Database for Telescope
        run: touch database/telescope.sqlite

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Publish Ziggy Configuration
        run: php artisan ziggy:generate

      - name: Build Assets
        run: pnpm run build
        env:
          APP_ENV: testing

      - name: Type Check
        run: pnpm run tsc

      - name: Frontend Tests
        run: pnpm test

      - name: Tests
        run: |
          mkdir -p build/logs
          ./vendor/bin/phpunit \
            --coverage-text=build/coverage.txt \
            --coverage-clover=build/logs/clover.xml

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## PHPUnit coverage'
            echo ''
            echo '```'
            if [ -f build/coverage.txt ]; then
              cat build/coverage.txt
            else
              echo 'No coverage report produced.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
