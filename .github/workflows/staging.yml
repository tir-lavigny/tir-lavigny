name: Deploy to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - dev

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  lint:
    uses: ./.github/workflows/lint.yml

  build:
    runs-on: ubuntu-latest
    needs: [tests, lint]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          APP_ENV: staging
      - name: Commit built assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Github Action"
          git checkout -B staging-deploy
          git add -f public/
          git commit -m "Build front-end assets"
          git push -f origin staging-deploy
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@master
        with:
          username: ${{ secrets.MASTER_SSH_USERNAME }}
          host: ${{ secrets.MASTER_SSH_HOST }}
          key: ${{ secrets.MASTER_SSH_KEY }}
          port: ${{ secrets.MASTER_SSH_PORT }}
          script: |
            cd ${{ secrets.STAGING_SSH_PATH }}
            chmod +x ./deploy-staging.sh
            ./deploy-staging.sh
  delete:
    name: Delete staging-deploy branch
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Delete staging-deploy branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Github Action"
          git push origin --delete staging-deploy
