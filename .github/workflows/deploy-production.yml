name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to deploy (e.g. v1.2.3 — image must already exist in GHCR)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    concurrency:
      group: laravel-production-deploy
      cancel-in-progress: false

    steps:
      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (production)
        run: |
          ssh ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} \
            "sudo /usr/local/sbin/tir-lavigny-deploy-production ${{ inputs.version }}"
