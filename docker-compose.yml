services:
    app:
        image: tir-lavigny-laravel:local
        restart: unless-stopped

        env_file:
            - .env

        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_HOST: db
            DB_PORT: 3306
            DAV_BASE_URL: http://dav:5232/
            DAV_USERNAME: test
            DAV_PASSWORD: test
            DAV_ADDRESSBOOK_URL: http://dav:5232/test/contacts/

        volumes:
            - laravel_storage:/var/www/storage

        depends_on:
            db:
                condition: service_healthy
            dav-init:
                condition: service_completed_successfully

        networks:
            - laravel

    web:
        image: tir-lavigny-laravel-web:local
        restart: unless-stopped

        ports:
            - "8080:80"

        volumes:
            - laravel_storage:/var/www/storage:ro

        depends_on:
            - app

        networks:
            - laravel

    scheduler:
        image: tir-lavigny-laravel:local
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]

        env_file:
            - .env

        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_HOST: db
            DB_PORT: 3306
            DAV_BASE_URL: http://dav:5232/
            DAV_USERNAME: test
            DAV_PASSWORD: test
            DAV_ADDRESSBOOK_URL: http://dav:5232/test/contacts/

        volumes:
            - laravel_storage:/var/www/storage

        depends_on:
            db:
                condition: service_healthy
            dav-init:
                condition: service_completed_successfully

        networks:
            - laravel

    db:
        image: mariadb:10.6
        restart: unless-stopped

        env_file:
            - .env

        environment:
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

        volumes:
            - mariadb_data:/var/lib/mysql

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

        networks:
            - laravel

    mailpit:
        image: axllent/mailpit
        ports:
            - 8025:8025
            - 1025:1025

    dav:
        image: tomsquest/docker-radicale:latest
        restart: unless-stopped

        environment:
            RADICALE_CONFIG_SERVER_HOSTS: 0.0.0.0:5232
            RADICALE_CONFIG_AUTH_TYPE: none
            RADICALE_CONFIG_STORAGE_FILESYSTEM_FOLDER: /data/collections

        ports:
            - "127.0.0.1:5232:5232"

        volumes:
            - radicale_data:/data

        healthcheck:
            test: ["CMD-SHELL", "curl --fail http://localhost:5232 || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

        networks:
            - laravel

    dav-init:
        image: curlimages/curl:latest
        restart: "no"

        depends_on:
            dav:
                condition: service_healthy

        entrypoint:
            - sh
            - -c
            - |
                curl -sS -o /dev/null -X MKCOL http://dav:5232/test/ || true
                curl -sS -o /dev/null -X MKCOL \
                    -H "Content-Type: application/xml; charset=utf-8" \
                    --data '<mkcol xmlns="DAV:" xmlns:card="urn:ietf:params:xml:ns:carddav"><set><prop><resourcetype><collection/><card:addressbook/></resourcetype><displayname>Contacts</displayname></prop></set></mkcol>' \
                    http://dav:5232/test/contacts/ || true

        networks:
            - laravel

networks:
    laravel:

volumes:
    mariadb_data:
    laravel_storage:
    radicale_data:
