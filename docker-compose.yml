services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        container_name: tir_lavigny_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/database/database.sqlite
            PULSE_DB_CONNECTION: pulse
            TELESCOPE_DB_CONNECTION: telescope
            CACHE_STORE: database
            SESSION_DRIVER: database
            QUEUE_CONNECTION: database
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
            MAIL_FROM_ADDRESS: "hello@tir-lavigny.ch"
        networks:
            - tir_lavigny

    nginx:
        image: nginx:alpine
        container_name: tir_lavigny_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
            - node
        networks:
            - tir_lavigny

    # Vite dev server with HMR
    node:
        image: node:24-alpine
        container_name: tir_lavigny_node
        restart: unless-stopped
        working_dir: /var/www
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www
            # Isolated volume prevents macOS/Linux binary conflicts
            - node_modules:/var/www/node_modules
        environment:
            VITE_HMR_HOST: localhost
        networks:
            - tir_lavigny

    # Mail catcher — web UI at http://localhost:8025
    mailpit:
        image: axllent/mailpit:latest
        container_name: tir_lavigny_mailpit
        restart: unless-stopped
        ports:
            - "8025:8025" # web UI
            - "1025:1025" # SMTP
        networks:
            - tir_lavigny

networks:
    tir_lavigny:
        driver: bridge

volumes:
    node_modules:
