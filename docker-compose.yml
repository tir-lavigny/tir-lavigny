services:
    app:
        image: tir-lavigny-laravel:local
        restart: unless-stopped

        env_file:
            - .env

        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_HOST: db
            DB_PORT: 3306

        volumes:
            - laravel_storage:/var/www/storage

        depends_on:
            db:
                condition: service_healthy

        networks:
            - laravel

    web:
        image: tir-lavigny-laravel-web:local
        restart: unless-stopped

        ports:
            - "8080:80"

        volumes:
            - laravel_storage:/var/www/storage:ro

        depends_on:
            - app

        networks:
            - laravel

    db:
        image: mariadb:10.6
        restart: unless-stopped

        env_file:
            - .env

        environment:
            MARIADB_DATABASE: ${DB_DATABASE}
            MARIADB_USER: ${DB_USERNAME}
            MARIADB_PASSWORD: ${DB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

        volumes:
            - mariadb_data:/var/lib/mysql

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

        networks:
            - laravel

networks:
    laravel:

volumes:
    mariadb_data:
    laravel_storage:
