services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: tir-lavigny-app:prod
    container_name: tir_lavigny_app
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env.prod
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tir_lavigny

  worker:
    image: tir-lavigny-app:prod
    container_name: tir_lavigny_worker
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env.prod
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tir_lavigny

  nginx:
    image: nginx:alpine
    container_name: tir_lavigny_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/storage:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - tir_lavigny

  # Auto-renews Let's Encrypt certificates every 12h — first run: make docker-prod-ssl
  certbot:
    image: certbot/certbot:latest
    container_name: tir_lavigny_certbot
    restart: unless-stopped
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - tir_lavigny

  db:
    image: mariadb:11
    container_name: tir_lavigny_db
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tir_lavigny

networks:
  tir_lavigny:
    driver: bridge

volumes:
  app_storage:
  db_data:
  certbot_conf:
  certbot_www:
